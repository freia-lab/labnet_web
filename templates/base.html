<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FREIA Labnet{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-size: .9rem; }
    .navbar-brand { font-weight: 700; letter-spacing: .05em; }
    .kind-badge { font-size: .7em; vertical-align: middle; }
    .port-cell { width: 120px; display: inline-block; margin: 2px; padding: 4px 6px;
                 border-radius: 4px; font-size: .78rem; vertical-align: top; }
    .port-free  { background: #d1e7dd; }
    .port-used  { background: #cfe2ff; }
    .hop-row td:first-child { color: #888; font-size: .8em; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🔌 FREIA Labnet</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/devices">Devices</a></li>
        <li class="nav-item"><a class="nav-link" href="/links">Links</a></li>
        <li class="nav-item"><a class="nav-link" href="/vlans">VLANs</a></li>
        <li class="nav-item"><a class="nav-link" href="/validate">Validate</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings">Settings</a></li>
      </ul>
      <form class="d-flex" action="/devices" method="get">
        <input class="form-control form-control-sm me-2" type="search" name="q"
               placeholder="Search hostname…" value="{{ request.args.get('q','') }}">
        <button class="btn btn-sm btn-outline-light" type="submit">Go</button>
      </form>
    </div>
  </div>
</nav>
<div class="container-fluid py-3">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
